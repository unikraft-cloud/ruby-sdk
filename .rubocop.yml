plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "pkg/**/*"
    - "vendor/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Exclude:
    - "test/**/*"

# Transport and polling code reads best as one method per request phase;
# the defaults would split it into helpers that are used exactly once.
Metrics/MethodLength:
  Max: 30
  Exclude:
    - "test/**/*"

Metrics/AbcSize:
  Max: 30
  Exclude:
    - "test/**/*"

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

Metrics/ClassLength:
  Max: 200
  Exclude:
    - "test/**/*"
    - "lib/**/*.gen.rb"

Metrics/BlockLength:
  Exclude:
    - "Rakefile"
    - "test/**/*"

# Keyword arguments mirror the error and request fields one to one.
Metrics/ParameterLists:
  CountKeywordArgs: false

Minitest/MultipleAssertions:
  Max: 8

# Generated plumbing: doc comments carry the spec's text verbatim, a class
# holds every operation of its tag, and a named **options keeps the
# YARD @param readable.
Layout/LineLength:
  Max: 100
  Exclude:
    - "lib/**/*.gen.rb"

Metrics/ModuleLength:
  Exclude:
    - "lib/**/*.gen.rb"

Style/ArgumentsForwarding:
  Exclude:
    - "lib/**/*.gen.rb"
